name: Image

on:
  pull_request:
  push:
    branches: [main]
    # The release tags. release-please creates them with the token of the release App
    # (release.yml), because a tag that GITHUB_TOKEN creates starts no workflow.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  schedule:
    # The daily rebuild of the newest release takes the updates of the sid packages on each
    # platform.
    - cron: "17 4 * * *"
  # A manual run on main is the daily rebuild. A manual run on a different branch only tests it.
  workflow_dispatch:

permissions: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # The release that the run publishes. A release tag vX.Y.Z publishes its own commit. The daily
  # rebuild and a manual run on main build the commit of the newest release again. Each other run
  # tests the commit of its event and publishes nothing: its outputs are empty. Each later job
  # checks out `sha`, so the image, the tests and the labels come from one commit.
  release:
    name: Find the release
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read # Read the newest release.
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          case "$EVENT:$GITHUB_REF" in
            push:refs/tags/*)
              tag=$GITHUB_REF_NAME
              sha=$GITHUB_SHA
              ;;
            schedule:refs/heads/main | workflow_dispatch:refs/heads/main)
              tag=$(gh release list --repo "$GITHUB_REPOSITORY" --json tagName,isLatest \
                --jq '.[] | select(.isLatest) | .tagName')
              if [ -z "$tag" ]; then
                echo "::notice::$GITHUB_REPOSITORY has no release, so this run tests main and publishes nothing"
                exit 0
              fi
              sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
              ;;
            *)
              echo "This run tests $GITHUB_REF and publishes nothing."
              exit 0
              ;;
          esac
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::The release tag $tag is not vX.Y.Z"
            exit 1
          fi
          echo "This run publishes the release $tag, commit $sha." | tee -a "$GITHUB_STEP_SUMMARY"
          { echo "sha=$sha"; echo "version=${BASH_REMATCH[1]}"; } >> "$GITHUB_OUTPUT"

  # Each platform builds on a GitHub-hosted runner of its own architecture, with no emulation. On
  # each event, this job builds, tests and scans the image of its platform. Its token cannot write
  # packages.
  test:
    name: Build, test and scan (${{ matrix.platform }})
    needs: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      # A failure on one platform does not cancel the other platform: each job runs all its steps.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read # Check out the repository.
      security-events: write # Upload the Trivy SARIF to code scanning.
    env:
      REBUILD: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      # The commit of the release, or the commit of the event when the run publishes nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false

      # The image gets only the commands that the copy loop of the Dockerfile names, so a tool of
      # mise.toml that the loop does not name is not in the image.
      - name: Check that the copy loop names each tool of mise.toml
        timeout-minutes: 1
        run: bash test/manifests.sh

      # The lint steps run on one platform, because their result is the same on each platform.
      # The image has no zizmor, so zizmor comes from its official image at a pinned digest. It runs
      # offline and gets no token.
      - name: Lint the workflows with zizmor
        if: ${{ matrix.arch == 'amd64' }}
        timeout-minutes: 2
        uses: docker://ghcr.io/zizmorcore/zizmor:1.33.1@sha256:ecd3ffe6158de1322e05a044ed43749bee12b1dccb7e1a7859bc6ac4b2a1c516
        with:
          args: --offline .github/workflows

      # The default builder uses the docker driver: the image goes into the image store of Docker
      # with no export, so the job sends no tarball of the image to Docker. The daily rebuild and a
      # manual run pull the base images again and use no cache.
      - name: Build
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: default
          context: .
          load: true
          tags: devtools:test
          pull: ${{ env.REBUILD }}
          no-cache: ${{ env.REBUILD }}

      - name: Show the image size
        timeout-minutes: 1
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          size=$(docker history --human=false --format '{{.Size}}' devtools:test | awk '{ sum += $1 } END { print sum }')
          echo "Image size ($PLATFORM): $(numfmt --to=si "$size")B, the sum of the uncompressed layers" | tee -a "$GITHUB_STEP_SUMMARY"

      # hadolint, actionlint and shellcheck come from the image that this job built, so a pull
      # request that updates one of them lints with the new version. actionlint also runs the
      # shellcheck of the image on each `run` script.
      - name: Lint the Dockerfiles with hadolint
        if: ${{ matrix.arch == 'amd64' }}
        timeout-minutes: 2
        run: >-
          docker run --rm -v "$PWD:/src:ro" -w /src devtools:test
          hadolint Dockerfile test/*.Dockerfile

      - name: Lint the workflows with actionlint
        if: ${{ matrix.arch == 'amd64' }}
        timeout-minutes: 2
        run: docker run --rm -v "$PWD:/src:ro" -w /src devtools:test actionlint

      - name: Lint the test scripts with shellcheck
        if: ${{ matrix.arch == 'amd64' }}
        timeout-minutes: 2
        run: docker run --rm -v "$PWD:/src:ro" -w /src devtools:test shellcheck test/*.sh

      # The default builder reads the image that the build put into the image store of Docker.
      - name: Test the version of each tool
        timeout-minutes: 5
        run: >-
          docker buildx build --builder default --no-cache --output type=cacheonly
          --build-arg DEVTOOLS=devtools:test --file test/tools.Dockerfile test

      - name: Test a COPY --from of one command into Debian trixie
        timeout-minutes: 5
        run: >-
          docker buildx build --builder default --build-arg DEVTOOLS=devtools:test
          --file test/copy-probe.Dockerfile test

      # The gate of the image: a finding in the npm or Python lock files fails the job.
      # python/osv-scanner.toml holds the ignores of the Python lock files.
      - name: Scan the lock files with osv-scanner
        timeout-minutes: 5
        run: >-
          docker run --rm -v "$PWD:/src:ro" -w /src devtools:test
          osv-scanner scan source
          --lockfile npm/package-lock.json
          --lockfile requirements.txt:python/copier.txt
          --lockfile requirements.txt:python/pre-commit.txt
          --lockfile requirements.txt:python/semgrep.txt
          --lockfile requirements.txt:python/ansible-lint.txt

      - name: Get the date for the Trivy cache key
        id: date
        timeout-minutes: 1
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # The databases of the newest run on main. Trivy downloads a database again when the copy
      # in the cache is out of date.
      - name: Restore the Trivy databases
        id: trivy-cache
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/trivy/db
            ${{ runner.temp }}/trivy/java-db
          key: trivy-db-${{ steps.date.outputs.day }}
          restore-keys: trivy-db-

      # The image scans itself with the Trivy of mise.lock (test/trivy.sh). The scan is report-only
      # (owner decision of 2026-11-19 in #1): the Go binaries of upstream tools at their newest
      # release hold HIGH and CRITICAL findings that no change here can fix. Every finding goes to
      # SARIF, and the job summary names the detected OS and the finding counts of each package
      # type. The gate stays on the lock files (the osv-scanner step).
      - name: Scan the image with Trivy
        timeout-minutes: 10
        run: bash test/trivy.sh devtools:test

      # Each platform has its own SARIF category, so that one upload does not replace the other.
      - name: Upload the Trivy SARIF
        if: ${{ !cancelled() && hashFiles('trivy.sarif') != '' }}
        timeout-minutes: 5
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: trivy.sarif
          category: trivy-image-${{ matrix.arch }}

      # The databases are the same for the two platforms, so one platform saves them, once a day.
      - name: Save the Trivy databases
        if: ${{ github.ref == 'refs/heads/main' && matrix.arch == 'amd64' && steps.trivy-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 5
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/trivy/db
            ${{ runner.temp }}/trivy/java-db
          key: ${{ steps.trivy-cache.outputs.cache-primary-key }}

  # For a release, after the two platforms pass: build the image of each platform again on a runner
  # of its architecture, and push it by digest with SBOM and provenance attestations. Only this job
  # and the publish job can write packages.
  push:
    name: Push by digest (${{ matrix.platform }})
    needs: [release, test]
    if: ${{ needs.release.outputs.version != '' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read # Check out the repository.
      packages: write # Push the image of the platform to GHCR.
    env:
      REBUILD: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      # The commit of the release, or the commit of the event when the run publishes nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false

      # The docker-container driver makes the SBOM and provenance attestations.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        timeout-minutes: 5

      # The labels of the image. The push has no tag: the publish job tags the manifest list. The
      # version X.Y.Z is the only tag here, so the label org.opencontainers.image.version gets it.
      # The daily rebuild runs on main, so the commit of the run is not the commit of the release:
      # the label org.opencontainers.image.revision gets the commit of the release.
      - id: meta
        timeout-minutes: 2
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ needs.release.outputs.sha }}

      - name: Log in to GHCR
        timeout-minutes: 5
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The push has no tag: the publish job tags the manifest list.
      - name: Push the image by digest
        id: push
        timeout-minutes: 20
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          pull: ${{ env.REBUILD }}
          no-cache: ${{ env.REBUILD }}

      - name: Keep the digest for the publish job
        timeout-minutes: 1
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # For a release, after each platform is pushed: the checks of the test job run again on the
  # pushed digest, so that the publish job tags only the bytes that passed them. The job pulls the
  # image of its platform into the image store of Docker, where the default builder and Trivy read
  # it.
  verify:
    name: Test and scan the pushed image (${{ matrix.platform }})
    needs: [release, push]
    if: ${{ needs.release.outputs.version != '' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read # Check out the repository.
      packages: read # Pull the pushed image from GHCR.
      security-events: write # Upload the Trivy SARIF to code scanning.
    steps:
      # The commit of the release, or the commit of the event when the run publishes nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false

      - name: Download the digest
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests

      - name: Get the pushed image
        id: pushed
        timeout-minutes: 1
        working-directory: ${{ runner.temp }}/digests
        run: |
          digests=(*)
          [ "${#digests[@]}" -eq 1 ] || { echo "::error::Expected one digest, found: ${digests[*]}"; exit 1; }
          echo "image=$IMAGE@sha256:${digests[0]}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        timeout-minutes: 5
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull the pushed image
        timeout-minutes: 5
        env:
          PUSHED: ${{ steps.pushed.outputs.image }}
        run: docker pull "$PUSHED"

      - name: Test the version of each tool in the pushed image
        timeout-minutes: 5
        env:
          PUSHED: ${{ steps.pushed.outputs.image }}
        run: >-
          docker buildx build --builder default --no-cache --output type=cacheonly
          --build-arg "DEVTOOLS=$PUSHED" --file test/tools.Dockerfile test

      - name: Test a COPY --from of one command of the pushed image into Debian trixie
        timeout-minutes: 5
        env:
          PUSHED: ${{ steps.pushed.outputs.image }}
        run: >-
          docker buildx build --builder default --build-arg "DEVTOOLS=$PUSHED"
          --file test/copy-probe.Dockerfile test

      - name: Get the date for the Trivy cache key
        id: date
        timeout-minutes: 1
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # The databases that the test job saved, or those of an earlier day.
      - name: Restore the Trivy databases
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/trivy/db
            ${{ runner.temp }}/trivy/java-db
          key: trivy-db-${{ steps.date.outputs.day }}
          restore-keys: trivy-db-

      # Report-only, as in the test job.
      - name: Scan the pushed image with Trivy
        timeout-minutes: 10
        env:
          PUSHED: ${{ steps.pushed.outputs.image }}
        run: bash test/trivy.sh "$PUSHED"

      # The scan of the pushed image has a category of its own, so that it does not replace the
      # scan of the test job.
      - name: Upload the Trivy SARIF
        if: ${{ !cancelled() && hashFiles('trivy.sarif') != '' }}
        timeout-minutes: 5
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: trivy.sarif
          category: trivy-pushed-${{ matrix.arch }}

  # For a release, after the checks of each pushed digest pass: one manifest list of the platform
  # digests, with the build provenance attestation of the list. The list gets the tag X.Y.Z, then
  # the attestation, and the tags X.Y, X and `latest` move to it only after the attestation passes.
  # The daily rebuild moves the same 4 tags to the new digest.
  publish:
    name: Publish the manifest list
    needs: [release, verify]
    if: ${{ needs.release.outputs.version != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read # Read the newest release.
      packages: write # Push the manifest list and its attestation to GHCR.
      id-token: write # Sign the build provenance attestation.
      attestations: write # Store the build provenance attestation.
    steps:
      # The tags X.Y, X and `latest` name the newest release. A newer release can come while this
      # run builds, for example during a daily rebuild. Then this run stops and moves no tag: the
      # run of the newer release publishes it, and the next daily rebuild builds it again.
      - name: Check that the release is the newest release
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          newest=$(gh release list --repo "$GITHUB_REPOSITORY" --json tagName,isLatest \
            --jq '.[] | select(.isLatest) | .tagName')
          if [ "$newest" != "v$VERSION" ]; then
            echo "::error::The newest release is ${newest:-none}, not v$VERSION, so this run moves no tag"
            exit 1
          fi

      - name: Download the digests
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        timeout-minutes: 5

      - name: Log in to GHCR
        timeout-minutes: 5
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The tags X.Y.Z, X.Y, X and `latest` of the release. The version X.Y.Z comes first.
      # `imagetools create` needs a tag, and the other tags come after the attestation. The
      # annotations go on the manifest list: GHCR reads the description of a multi-arch image from
      # the annotations of its manifest list, not from the labels of each platform image.
      - id: meta
        timeout-minutes: 2
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.version }}
          flavor: latest=true
          annotations: |
            org.opencontainers.image.revision=${{ needs.release.outputs.sha }}

      # One manifest list holds the image and the SBOM and provenance attestations of each
      # platform. `imagetools create` copies no layer: each platform digest is in GHCR already.
      - name: Make the manifest list
        id: index
        timeout-minutes: 5
        working-directory: ${{ runner.temp }}/digests
        env:
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mapfile -t annotations < <(sed -e '/^$/d' -e 's/^/--annotation=/' <<< "$ANNOTATIONS")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create --metadata-file "$RUNNER_TEMP/index.json" \
            --tag "$IMAGE:$VERSION" "${annotations[@]}" "${sources[@]}"
          echo "digest=$(jq -r '."containerimage.descriptor".digest' "$RUNNER_TEMP/index.json")" >> "$GITHUB_OUTPUT"

      - name: Attest the build provenance
        timeout-minutes: 5
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

      # A copy of a manifest list with one source and no annotation keeps the digest. The step
      # stops if the tags X.Y, X and `latest` get a different digest.
      - name: Tag the attested manifest list X.Y, X and latest
        timeout-minutes: 5
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mapfile -t tags < <(jq -r --arg version "$IMAGE:$VERSION" \
            '.tags[] | select(. != $version) | "--tag=" + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create --metadata-file "$RUNNER_TEMP/tags.json" "${tags[@]}" "$IMAGE@$DIGEST"
          tagged=$(jq -r '."containerimage.descriptor".digest' "$RUNNER_TEMP/tags.json")
          if [ "$tagged" != "$DIGEST" ]; then
            echo "::error::${tags[*]} have the digest $tagged, not the attested digest $DIGEST"
            exit 1
          fi

      # The attestation pushes a second package version under the referrers fallback tag
      # `sha256-<digest>`, and GHCR shows the newest version, so this copy gives that index the
      # annotations of the manifest list. The dry run prints the new index and pushes nothing: the
      # job stops before the push when the copy would drop a field of a descriptor, which would
      # hide the attestation from `gh attestation verify --bundle-from-oci`, or the description.
      - name: Annotate the attestation referrers index
        timeout-minutes: 5
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
        run: |
          tag="$IMAGE:sha256-${DIGEST#sha256:}"
          docker buildx imagetools inspect --raw "$tag" > "$RUNNER_TEMP/referrers.json"
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" > "$RUNNER_TEMP/manifest-list.json"
          mapfile -t annotations < <(sed -e '/^$/d' -e 's/^/--annotation=/' <<< "$ANNOTATIONS")
          docker buildx imagetools create --dry-run "${annotations[@]}" --tag "$tag" "$tag" \
            > "$RUNNER_TEMP/referrers-copy.json"
          jq -S '.manifests' "$RUNNER_TEMP/referrers.json" > "$RUNNER_TEMP/referrers-before.json"
          jq -S '.manifests' "$RUNNER_TEMP/referrers-copy.json" > "$RUNNER_TEMP/referrers-after.json"
          if ! cmp -s "$RUNNER_TEMP/referrers-before.json" "$RUNNER_TEMP/referrers-after.json"; then
            echo "::error::The copy of $tag would change a field of a descriptor, so the attestation would leave the registry"
            diff -u "$RUNNER_TEMP/referrers-before.json" "$RUNNER_TEMP/referrers-after.json" | head -n 40 || true
            exit 1
          fi
          description=$(jq -r '.annotations["org.opencontainers.image.description"] // ""' \
            "$RUNNER_TEMP/manifest-list.json")
          copied=$(jq -r '.annotations["org.opencontainers.image.description"] // ""' \
            "$RUNNER_TEMP/referrers-copy.json")
          if [ "$copied" != "$description" ]; then
            echo "::error::The copy of $tag would have the description '${copied}', not '${description}'"
            exit 1
          fi
          docker buildx imagetools create "${annotations[@]}" --tag "$tag" "$tag"

      - name: Show the manifest list
        timeout-minutes: 5
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST"
          tags=$(jq -r '[.tags[] | sub(".*:"; "")] | join(", ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          echo "Published $IMAGE@$DIGEST with the tags $tags" | tee -a "$GITHUB_STEP_SUMMARY"
