name: Release

# release-please makes each release of this repository. On each push to main, the reusable workflow
# release.yml of dan-petty/github-workflows opens or updates one release pull request and turns on
# auto-merge. When it merges after its checks pass, the next run creates the tag vX.Y.Z and its
# GitHub release. Its job runs in the environment release, which holds the variable
# RELEASE_APP_CLIENT_ID and the secret RELEASE_APP_PRIVATE_KEY of the release App, and only main
# deploys to it (github/repository.yaml). The repository holds no secret of its own.
# The caller must pass the secret by name, and the job gets the value of the secret of the
# environment. The caller passes no other secret: no `secrets: inherit`.
# The caller pins the commit of the release tag of dan-petty/github-workflows that rendered this
# file, with the tag in a comment: the form of a digest pin of the github-actions manager of
# Renovate. Only `copier update` changes both: Renovate leaves this pin to the template.
on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    uses: dan-petty/github-workflows/.github/workflows/release.yml@39f92fb644e550f84a5797cce46a80a891231d4a # v0.1.0
    # The token of the release App writes the release; the job token gets no permission.
    permissions: {}
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
