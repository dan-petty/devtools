# The tools that Debian sid does not have, or has at an old version. mise.lock holds the
# download URL and the checksum of each one for linux-x64 and linux-arm64, and the image installs
# them with `mise install --locked`. Renovate updates the versions here and runs `mise lock`, which
# keeps the platforms that are in mise.lock.
# A tool that has no short name in the mise registry uses the github backend.
[tools]
argo = "4.1.6"
argo-rollouts = "1.10.2"
argocd = "3.6.2"
cloudflared = "2026.11.1"
gh = "2.105.0"
"github:agavra/tuicr" = "0.29.0"
"github:dlvhdr/gh-dash" = "4.26.3"
# The maintained fork of actionlint, which knows the current runner labels. The registry
# name `actionlint` is the upstream rhysd/actionlint, which has had no release since 1.7.12.
"github:kjanat/actionlint" = "1.17.1"
# OpenTelemetry Weaver, the CLI of the semantic conventions.
"github:open-telemetry/weaver" = "0.28.0"
gitleaks = "8.30.1"
golangci-lint = "2.15.0"
hadolint = "2.15.1"
helm = "4.3.2"
k9s = "0.51.0"
kube-linter = "0.8.3"
kubeconform = "0.8.0"
kubectl = "1.37.2"
kustomize = "5.8.3"
minikube = "1.39.0"
opentofu = "1.13.9"
osv-scanner = "2.7.1"
pluto = "5.24.5"
popeye = "0.22.1"
promtool = "3.16.0"
tflint = "0.66.0"
trivy = "0.76.2"
vale = "3.28.1"
